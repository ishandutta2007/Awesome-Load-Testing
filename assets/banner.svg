<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid / Traffic Glow -->
    <linearGradient id="trafficGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      /* Dynamic Animated Pulse Rings */
      @keyframes pulseRing {
        0% { r: 4px; opacity: 1; }
        50% { r: 16px; opacity: 0.3; }
        100% { r: 24px; opacity: 0; }
      }

      /* Animated Sine Wave / Traffic Wave */
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }

      /* Dynamic Bar Fluctuation */
      @keyframes barJitter1 {
        0%, 100% { height: 45px; y: 245px; }
        50% { height: 80px; y: 210px; }
      }
      @keyframes barJitter2 {
        0%, 100% { height: 95px; y: 195px; }
        50% { height: 60px; y: 230px; }
      }
      @keyframes barJitter3 {
        0%, 100% { height: 120px; y: 170px; }
        50% { height: 145px; y: 145px; }
      }

      .pulse-1 { animation: pulseRing 3s ease-out infinite; }
      .pulse-2 { animation: pulseRing 3s ease-out infinite 1.5s; }
      .wave-line { stroke-dasharray: 12, 8; animation: dashMove 25s linear infinite; }
      
      .bar-anim-1 { animation: barJitter1 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barJitter2 3.2s ease-in-out infinite; }
      .bar-anim-3 { animation: barJitter3 4.8s ease-in-out infinite; }

      .badge-pill {
        fill: #1e293b;
        stroke: #334155;
        stroke-width: 1;
        rx: 14;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind and subtle) -->
  <g opacity="0.45">
    <!-- Area under performance curve -->
    <path d="M 0 300 Q 250 240 500 280 T 950 200 T 1200 240 L 1200 360 L 0 360 Z" fill="url(#chartArea)" />
    
    <!-- Synthetic Traffic Stream Wave -->
    <path class="wave-line" d="M -50 300 Q 250 240 500 280 T 950 200 T 1250 240" fill="none" stroke="url(#trafficGradient)" stroke-width="3" filter="url(#softGlow)" />
    <path d="M -50 320 Q 300 260 600 295 T 1050 230 T 1250 260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Fluctuating Metric Bars in Background Right -->
    <g transform="translate(1020, 0)" opacity="0.65">
      <rect x="0" y="245" width="10" height="45" rx="3" fill="#38bdf8" class="bar-anim-1" />
      <rect x="18" y="195" width="10" height="95" rx="3" fill="#818cf8" class="bar-anim-2" />
      <rect x="36" y="170" width="10" height="120" rx="3" fill="#c084fc" class="bar-anim-3" />
      <rect x="54" y="220" width="10" height="70" rx="3" fill="#38bdf8" class="bar-anim-2" />
      <rect x="72" y="185" width="10" height="105" rx="3" fill="#ec4899" class="bar-anim-1" />
    </g>

    <!-- Concurrency Target Radar Point with Expanding Pulse -->
    <g transform="translate(950, 200)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <circle class="pulse-1" cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle class="pulse-2" cx="0" cy="0" r="6" fill="none" stroke="#c084fc" stroke-width="1.5" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Capability Tags -->
  <g transform="translate(70, 0)">
    
    <!-- Category Mini-Badge -->
    <g transform="translate(0, 52)">
      <rect class="badge-pill" x="0" y="0" width="220" height="28" fill-opacity="0.8" />
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#softGlow)" />
      <text class="mono-text" x="28" y="19" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text class="sans-text" x="0" y="132" fill="url(#primaryGradient)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Load Testing</text>
    <text class="sans-text" x="0" y="132" fill="url(#primaryGradient)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Load Testing</text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text class="sans-text" x="0" y="176" fill="#f8fafc" font-size="18.5" font-weight="500">
      High-Concurrency Traffic Generation, Benchmarking &amp; Performance Engineering
    </text>

    <text class="sans-text" x="0" y="206" fill="#94a3b8" font-size="14" font-weight="400">
      A vetted catalog of enterprise SaaS platforms and battle-tested open-source tools (k6, wrk, Locust, JMeter, Gatling).
    </text>

    <!-- Metric / Pillar Interactive Pills -->
    <g transform="translate(0, 250)">
      <!-- Pill 1: Protocols -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text class="sans-text" x="16" y="23" fill="#38bdf8" font-size="13" font-weight="600">⚡ HTTP/2 · gRPC · WS</text>
      </g>

      <!-- Pill 2: Concurrency -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="195" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text class="sans-text" x="16" y="23" fill="#818cf8" font-size="13" font-weight="600">🚀 Distributed Injection</text>
      </g>

      <!-- Pill 3: Continuous CI/CD -->
      <g transform="translate(389, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text class="sans-text" x="16" y="23" fill="#c084fc" font-size="13" font-weight="600">🔄 CI/CD SLO &amp; Gating</text>
      </g>

      <!-- Pill 4: Latency & SLAs -->
      <g transform="translate(581, 0)">
        <rect x="0" y="0" width="195" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text class="sans-text" x="16" y="23" fill="#34d399" font-size="13" font-weight="600">📊 p99 Latency Telemetry</text>
      </g>
    </g>
  </g>
</svg>
